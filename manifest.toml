#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "fail2ban-web"
name = "Fail2Ban Webinterface"
description.en = "Monitor Fail2Ban and manually ban / release IP's"
description.fr = "Monitorer Fail2Ban et bannir ou dé-bannir des IP's"

version = "1.4~ynh1"

maintainers = ["ewilly"]

[upstream]
license = "AGPL-3.0-or-later"
code = "https://codeberg.org/ewilly/fail2ban-web-interface-php"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/fail2ban-web"

[resources]
    [resources.sources]
        [resources.sources.main]
        url = "https://codeberg.org/ewilly/fail2ban-web-interface-php/archive/v1.4.tar.gz"
        sha256 = "29853949670265c94d2daf89a3d72b2349441a69056498dbaa8de3dd94b7d331"
        autoupdate.strategy = "latest_forgejo_release"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"
    main.auth_header = false
    main.show_tile = true
    main.protected= true
    main.allowed = "admins"

    [resources.apt]
    packages = "fail2ban, php8.5-fpm"
